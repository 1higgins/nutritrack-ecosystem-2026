name: mobile_app
description: "A new Flutter project for NutriTrack Enterprise."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  google_fonts: ^6.2.1
  
  # Manejo de fechas y formatos (Crucial para el gráfico)
  intl: ^0.19.0
  
  curved_navigation_bar: ^1.0.6
  
  # Versión compatible con intl 0.19.0 y Flutter moderno
  syncfusion_flutter_charts: ^33.2.4
  animations: ^2.2.0

  # 📍 SISTEMA DE PERSISTENCIA INDUSTRIAL: Guarda sesión por 240 minutos
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/LOGO_NUTRITRACK.JPG
    - assets/icons/Inventario.png
    - assets/icons/Estadisticas.png
    - assets/icons/ajustamiento.png
    - assets/icons/notificaciones.png